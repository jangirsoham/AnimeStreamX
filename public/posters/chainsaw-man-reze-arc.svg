<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 980" role="img" aria-labelledby="title desc">
  <title id="title">Chainsaw Man: Reze Arc placeholder poster</title>
  <desc id="desc">A dark red placeholder poster for Chainsaw Man: The Movie: Reze Arc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12090b"/>
      <stop offset=".52" stop-color="#701c1d"/>
      <stop offset="1" stop-color="#17090b"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d3bd"/>
      <stop offset=".45" stop-color="#bd6257"/>
      <stop offset="1" stop-color="#3c1419"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="700" height="980" fill="url(#bg)"/>
  <path d="M-80 760 760 130" stroke="#b62d2d" stroke-width="34" opacity=".28"/>
  <path d="M-120 850 760 190" stroke="#f1b09b" stroke-width="9" opacity=".3"/>
  <circle cx="510" cy="270" r="170" fill="#d9342d" opacity=".18" filter="url(#glow)"/>
  <path d="M110 860 520 210" stroke="url(#blade)" stroke-width="28" opacity=".78"/>
  <path d="M98 854 520 210" stroke="#f7e4d6" stroke-width="3" opacity=".8"/>
  <path d="M520 210 571 135 562 253Z" fill="#2b0e12"/>
  <path d="M490 258 588 303" stroke="#12090b" stroke-width="18"/>
  <path d="M460 325 635 398" stroke="#12090b" stroke-width="8" opacity=".65"/>
  <text x="54" y="100" fill="#f7e4d6" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="7">THE MOVIE</text>
  <text x="48" y="184" fill="#f7e4d6" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-3">CHAINSAW</text>
  <text x="50" y="246" fill="#f7e4d6" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="2">MAN</text>
  <path d="M51 270H340" stroke="#d9342d" stroke-width="8"/>
  <text x="54" y="916" fill="#f7e4d6" font-family="Arial, Helvetica, sans-serif" font-size="32" letter-spacing="5">REZE ARC</text>
  <text x="55" y="948" fill="#f0a896" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">EMBED LINK PENDING</text>
